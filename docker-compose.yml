services:
  mongodb:
    image: mongo:latest
    container_name: movieshub-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mongo-express:
      image: mongo-express:latest
      container_name: mongo_express
      ports:
        - "8081:8081"
      environment:
        ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_EXPRESS_USERNAME}
        ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_EXPRESS_PASSWORD}
        ME_CONFIG_MONGODB_URL: mongodb://admin:password@localhost:27017
      depends_on: 
        - mongodb

volumes:
  mongodb_data: